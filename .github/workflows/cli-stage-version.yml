name: CLI Stage Version

on:
  pull_request:
    paths:
      - Directory.Packages.props
      - .github/scripts/cli-stage-version.mjs
      - .github/workflows/cli-stage-version.yml
  push:
    branches: [main]
    paths:
      - Directory.Packages.props
      - .github/scripts/cli-stage-version.mjs
      - .github/workflows/cli-stage-version.yml
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Deliberately not a required status check: live CLI pin drift must not block unrelated PRs or coordinated releases.
jobs:
  cli-stage-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/cli-stage-version.mjs
