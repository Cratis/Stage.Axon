name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the CI guards (synthetic fixtures only)
        run: node --test .github/scripts/packable-guard.test.mjs .github/scripts/no-package-publish.test.mjs
      - name: Reject package publication in workflows and build files
        run: node .github/scripts/no-package-publish.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release with warnings as errors
        run: dotnet build Stage.Axon.slnx -c Release -warnaserror
      - name: Guard packable projects against Screenplay.Generation (Release graph)
        run: node .github/scripts/packable-guard.mjs --configuration Release
      - name: Build Debug including inline specifications
        run: dotnet build Stage.Axon.slnx -c Debug
      - name: Guard packable projects against Screenplay.Generation (Debug graph)
        run: node .github/scripts/packable-guard.mjs --configuration Debug
      - name: Run all specifications and reject empty results
        shell: bash
        run: |
          set -euo pipefail
          for project in Rendering.Axon Rendering.Axon.Verification Rendering.Conformance.Specs Samples.MinimalTarget; do
            results="$RUNNER_TEMP/axon-results/$project"
            dotnet test "Source/$project/$project.csproj" -c Debug --no-build --logger 'trx;LogFileName=specs.trx' --results-directory "$results"
            python3 .github/spec-shards.py require-executed "$results/specs.trx"
          done
      - name: Preserve specification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-specs
          path: ${{ runner.temp }}/axon-results/**
          if-no-files-found: error
          retention-days: 7
  java:
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Source/Rendering.Axon/Emitters/Scaffold/AxonMavenProject.cs
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Build the standalone verification harness
        run: dotnet build Stage.Axon.slnx -c Debug
      - name: Render all 23 corpus applications
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          -c Debug --no-build -- render "${{ runner.temp }}/axon-corpus"
      - name: Type-check every generated TypeScript client
        working-directory: ${{ runner.temp }}/axon-corpus
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typescript" --ignore-scripts --no-audit --no-fund typescript@7.0.2
          for config in */client/tsconfig.json; do
            npm exec --prefix "$RUNNER_TEMP/typescript" --package=typescript@7.0.2 -- tsc -p "$PWD/$config" --noEmit
          done
      - name: Compile and execute every generated Maven module
        working-directory: ${{ runner.temp }}/axon-corpus
        run: sh ./mvnw -B -fae verify
      - name: Require passing native tests and the exact disabled-test budgets
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          -c Debug --no-build -- verify "${{ runner.temp }}/axon-corpus"
      - name: Preserve native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-native-reports
          path: ${{ runner.temp }}/axon-corpus/**/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7
