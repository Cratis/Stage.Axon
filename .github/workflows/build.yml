name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the CI guards (synthetic fixtures only)
        run: node --test .github/scripts/packable-guard.test.mjs .github/scripts/package-allowlist.test.mjs .github/scripts/cli-version-guard.test.mjs
      - name: Guard Contracts and Screenplay versions against the CLI
        run: node .github/scripts/cli-version-guard.mjs
      - name: Guard package publication against the allowlist
        run: node .github/scripts/package-allowlist.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release with warnings as errors
        run: dotnet build Stage.Axon.slnx -c Release -warnaserror
      - name: Guard packable projects against Screenplay.Generation (Release graph)
        run: node .github/scripts/packable-guard.mjs --configuration Release
      - name: Pack the renderer and verify the package set
        run: |
          dotnet pack Source/Rendering.Axon/Rendering.Axon.csproj -c Release --no-build -o "$RUNNER_TEMP/axon-package"
          node .github/scripts/package-allowlist.mjs --packed "$RUNNER_TEMP/axon-package"
      - name: Build Debug including inline specifications
        run: dotnet build Stage.Axon.slnx -c Debug
      - name: Guard packable projects against Screenplay.Generation (Debug graph)
        run: node .github/scripts/packable-guard.mjs --configuration Debug
      - name: Run all specifications and reject empty results
        shell: bash
        run: |
          set -euo pipefail
          for project in Rendering.Axon Rendering.Axon.Verification Rendering.Conformance.Specs Samples.MinimalTarget; do
            results="$RUNNER_TEMP/axon-results/$project"
            dotnet test "Source/$project/$project.csproj" -c Debug --no-build --logger 'trx;LogFileName=specs.trx' --results-directory "$results"
            python3 .github/spec-shards.py require-executed "$results/specs.trx"
          done
      - name: Preserve specification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-specs
          path: ${{ runner.temp }}/axon-results/**
          if-no-files-found: error
          retention-days: 7
  java:
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            Source/Rendering.Axon/Emitters/Scaffold/AxonMavenProject.cs
            Source/Runtime/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Build the standalone verification harness
        run: dotnet build Stage.Axon.slnx -c Debug
      - name: Render every corpus application
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          -c Debug --no-build -- render "${{ runner.temp }}/axon-corpus"
      - name: Test and install the Stage Axon runtime the rendered apps pin
        working-directory: Source/Runtime
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<stage-axon-runtime.version>\([^<]*\)</stage-axon-runtime.version>.*:\1:p' "$RUNNER_TEMP"/axon-corpus/*/pom.xml | sort -u)
          [ -n "$version" ] && [ "$(printf '%s\n' "$version" | wc -l)" -eq 1 ] || { echo "::error::Rendered apps must pin exactly one runtime version: $version"; exit 1; }
          sh ./mvnw -B -Drevision="$version" install
      - name: Run the generated HTTP transport proofs
        run: node --test "Source/Rendering.Axon/Emitters/Client/Tests/*.test.mjs"
      - name: Type-check every generated TypeScript client and the client-proof scenarios
        working-directory: ${{ runner.temp }}/axon-corpus
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typescript" --ignore-scripts --no-audit --no-fund typescript@7.0.2
          tsc="$RUNNER_TEMP/typescript/node_modules/.bin/tsc"
          "$tsc" --version
          configs=(*/client/tsconfig.json)
          [ -e "${configs[0]}" ] || { echo "No generated client tsconfig.json found"; exit 1; }
          for config in "${configs[@]}"; do
            "$tsc" -p "$PWD/$config" --noEmit
          done
          proof=client-proof/client/test/tsconfig.json
          [ -e "$proof" ] || { echo "No client-proof scenario tsconfig.json found"; exit 1; }
          "$tsc" -p "$PWD/$proof" --noEmit
      - name: Compile and execute every generated Maven module
        working-directory: ${{ runner.temp }}/axon-corpus
        run: sh ./mvnw -B -fae verify
      - name: Run the Scene proof host
        working-directory: Source/Rendering.Axon.Verification/ClientProof/scene
        run: npm ci --ignore-scripts --no-audit --no-fund && npm exec -- tsc -p . --noEmit && node --test "test/"*.test.ts
      - name: Require passing native tests and the exact disabled-test budgets
        run: >-
          dotnet run --project Source/Rendering.Axon.Verification/Rendering.Axon.Verification.csproj
          -c Debug --no-build -- verify "${{ runner.temp }}/axon-corpus"
      - name: Preserve native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-native-reports
          path: ${{ runner.temp }}/axon-corpus/**/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7
